<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>anime.js + CCapture.js (Canvas)</title>
  <style>body{color:#fff;background:#111;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;display:flex}#canvas-wrapper{background:#222;border-radius:8px;width:600px;height:400px;position:relative;overflow:hidden}#canvas-container{width:100%;height:100%;display:block}.settings{color:#ccc;align-items:center;gap:16px;margin-top:10px;font-size:13px;display:flex}.settings select{color:#fff;background:#333;border:none;border-radius:4px;padding:4px 8px;font-size:13px}.controls{gap:10px;margin-top:16px;display:flex}button{cursor:pointer;color:#fff;background:#007acc;border:none;border-radius:4px;padding:8px 16px;font-size:14px}button:disabled{opacity:.5;cursor:not-allowed}</style>
  <script type="module" crossorigin src="/assets/index-D2ji4Mr3.js"></script>
</head>
<body>

  <div id="canvas-wrapper">
    <canvas id="canvas-container" width="600" height="400"></canvas>
  </div>

  <div class="settings">
    <label>Resolution
      <select id="export-resolution">
        <option value="600x400">Fit (600×400)</option>
        <option value="1280x720">720p (1280×720)</option>
        <option value="1920x1080" selected>1080p (1920×1080)</option>
        <option value="2560x1440">2K (2560×1440)</option>
        <option value="3840x2160">4K (3840×2160)</option>
      </select>
    </label>
    <label>FPS
      <select id="export-fps">
        <option value="24">24</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
      </select>
    </label>
  </div>

  <div class="controls">
    <button id="btn-play">Play Animation</button>
    <button id="btn-export">Export MP4</button>
  </div>

</body>
</html>
