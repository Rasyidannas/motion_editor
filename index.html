<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>anime.js + CCapture.js (Canvas)</title>
  <style>
    body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #fff; font-family: sans-serif; }
    #canvas-wrapper { position: relative; width: 600px; height: 400px; border-radius: 8px; background: #222; overflow: hidden; }
    #canvas-container { display: block; width: 100%; height: 100%; }
    .settings { margin-top: 10px; display: flex; gap: 16px; align-items: center; color: #ccc; font-size: 13px; }
    .settings select { padding: 4px 8px; border-radius: 4px; border: none; background: #333; color: #fff; font-size: 13px; }
    .controls { margin-top: 16px; display: flex; gap: 10px; }
    button { padding: 8px 16px; cursor: pointer; font-size: 14px; border-radius: 4px; border: none; background: #007acc; color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="canvas-wrapper">
    <canvas id="canvas-container" width="600" height="400"></canvas>
  </div>

  <div class="settings">
    <label>Resolution
      <select id="export-resolution">
        <option value="600x400">Fit (600×400)</option>
        <option value="1280x720">720p (1280×720)</option>
        <option value="1920x1080" selected>1080p (1920×1080)</option>
        <option value="2560x1440">2K (2560×1440)</option>
        <option value="3840x2160">4K (3840×2160)</option>
      </select>
    </label>
    <label>FPS
      <select id="export-fps">
        <option value="24">24</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
      </select>
    </label>
  </div>

  <div class="controls">
    <button id="btn-play">Play Animation</button>
    <button id="btn-export">Export MP4</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
