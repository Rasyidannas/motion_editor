<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>motion_editor — CCapture export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #111; color: #eee;
    font-family: "Inter", system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  #stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center;
    background: #000; min-width: 0; }
  #stage { background: #000; max-width: 100%; max-height: 100%;
    aspect-ratio: 16 / 9; width: min(100%, calc(100vh * 16 / 9)); }
  #panel { width: 320px; flex-shrink: 0; background: #18181b; border-left: 1px solid #333;
    padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  #panel h1 { font-size: 16px; font-weight: 800; }
  #panel h1 small { display: block; font-size: 11px; font-weight: 600; color: #a1a1aa; margin-top: 2px; }
  #panel label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: #a1a1aa; display: flex; flex-direction: column; gap: 6px; }
  #panel select, #panel input[type="number"] { background: #27272a; color: #eee;
    border: 1px solid #3f3f46; border-radius: 8px; padding: 8px; font-size: 13px; }
  #panel button { border: 0; border-radius: 8px; padding: 10px; font-size: 13px;
    font-weight: 700; cursor: pointer; }
  #btn-play { background: #3f3f46; color: #fff; }
  #btn-export { background: #8b5cf6; color: #fff; }
  #btn-export:disabled, #btn-play:disabled { opacity: .45; cursor: default; }
  #scrub { width: 100%; }
  #time { font-size: 12px; color: #d4d4d8; font-variant-numeric: tabular-nums; }
  #progress { height: 8px; background: #27272a; border-radius: 99px; overflow: hidden; }
  #progress > div { height: 100%; width: 0%; background: #8b5cf6; }
  #log { font-size: 11px; line-height: 1.5; color: #a1a1aa; white-space: pre-wrap;
    background: #09090b; border: 1px solid #27272a; border-radius: 8px; padding: 10px;
    min-height: 120px; max-height: 260px; overflow-y: auto; }
  #log .ok { color: #4ade80; } #log .err { color: #f87171; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  a.back { font-size: 12px; color: #8b5cf6; text-decoration: none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap"><canvas id="stage" width="1920" height="1080"></canvas></div>
  <div id="panel">
    <h1>CCapture export<small>main.html timeline &rarr; single canvas</small></h1>
    <a class="back" href="main.html">&larr; back to preview (main.html)</a>
    <div class="row">
      <button id="btn-play" disabled>&#9654; Play</button>
    </div>
    <label>Scrub timeline
      <input id="scrub" type="range" min="0" max="23.46" step="0.0167" value="0">
    </label>
    <div id="time">t = 0.00s / 23.46s</div>
    <label>Format
      <select id="opt-format">
        <option value="mp4" selected>mp4 (H.264, WebCodecs)</option>
        <option value="webm">webm (VP9, WebCodecs)</option>
      </select>
    </label>
    <div class="row">
      <label>FPS
        <select id="opt-fps">
          <option value="30" selected>30</option>
          <option value="60">60</option>
        </select>
      </label>
      <label>Quality
        <input id="opt-quality" type="number" min="1" max="100" value="90">
      </label>
    </div>
    <button id="btn-export" disabled>&#9679; Export video</button>
    <div id="progress"><div></div></div>
    <div id="log">booting…</div>
  </div>
</div>

<video id="logo-vid" src="assets/logo.mp4" muted playsinline preload="auto"
  style="position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;"></video>

<script src="https://cdn.jsdelivr.net/npm/ccapture.js@2/build/ccapture.umd.min.js" crossorigin="anonymous"></script>
<script src="scripts/export_timeline.js"></script>
<script src="scripts/bg_prerender.js"></script>
<script src="scripts/canvas_scenes.js"></script>
<script>
(function () {
  'use strict';
  var W = 1920, H = 1080;
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var video = document.getElementById('logo-vid');
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('log'), bar = document.querySelector('#progress > div');

  function log(msg, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  // Surface *any* unexpected failure in the panel, not just the console:
  // without these, a rejected promise during export leaves #log frozen.
  window.addEventListener('error', function (e) {
    var where = e.filename ? ' @ ' + e.filename + ':' + (e.lineno || '?') : '';
    log('window error: ' + (e.message || e.error) + where, 'err');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    log('unhandled rejection: ' + (r && (r.message || r) || r), 'err');
  });
  function setBar(p) { bar.style.width = (p * 100).toFixed(1) + '%'; }
  function fmtT(t) { return 't = ' + t.toFixed(2) + 's / ' + ExportTL.TL.TOTAL.toFixed(2) + 's'; }

  var TOTAL = ExportTL.TL.TOTAL;
  $('scrub').max = TOTAL;

  var tCur = 0, playing = false, lastWall = 0, exporting = false;

  // NOTE: while CCapture is recording, it warps the page clock (TimeWarp):
  // window.setTimeout / setInterval / requestAnimationFrame only fire when the
  // warped frameTime advances — i.e. inside capturer.capture(). Awaiting a
  // real timer between two captures therefore deadlocks forever (the next
  // capture, which would advance the clock, never runs). So everything inside
  // the export loop must be timer-free: no setTimeout/setInterval/rAF awaits.
  // MessageChannel is NOT patched by TimeWarp and is used as the only yield.
  function channelYield() {
    return new Promise(function (resolve) {
      var ch = new MessageChannel();
      ch.port1.onmessage = function () {
        ch.port1.close();
        resolve();
      };
      ch.port2.postMessage(0);
    });
  }

  function seekVideo(time) {
    return new Promise(function (resolve) {
      var done = false;
      function fin() { if (!done) { done = true; resolve(); } }
      if (!isFinite(time) || time < 0) { fin(); return; }
      try {
        var onSeek = function () {
          try { video.removeEventListener('seeked', onSeek); } catch (e) {}
          fin();
        };
        video.addEventListener('seeked', onSeek);
        try {
          video.currentTime = Math.min(time, 2.43);
        } catch (e) {
          try { video.removeEventListener('seeked', onSeek); } catch (_) {}
          fin();
          return;
        }
        // Watchdog without timers: bounded MessageChannel spins let the real
        // event loop (video decode + 'seeked') run. Never resolves via a
        // warped setTimeout, so it cannot deadlock the capture loop.
        var ch = new MessageChannel();
        var n = 0;
        ch.port1.onmessage = function () {
          if (done) { try { ch.port1.close(); } catch (e) {} return; }
          if (++n > 20000) {
            try { video.removeEventListener('seeked', onSeek); } catch (e) {}
            try { ch.port1.close(); } catch (e) {}
            fin();
            return;
          }
          ch.port2.postMessage(0);
        };
        ch.port2.postMessage(0);
      } catch (e) { fin(); }
    });
  }

  function draw(t) {
    CanvasScenes.renderAt(ctx, t);
    tCur = t;
    $('time').textContent = fmtT(tCur);
    if (!exporting) $('scrub').value = tCur;
  }

  // --- preview loop (realtime; video plays normally) -------------------------
  var lastSeg = null;
  function segOf(t) {
    if (t < 8.1) return 's1';
    if (t < 14.8) return 's2';
    if (t < 20.96) return 's3';
    return 's4';
  }
  function previewTick(wall) {
    if (!playing || exporting) return;
    var dt = Math.min((wall - lastWall) / 1000, 0.1);
    lastWall = wall;
    var t = Math.min(tCur + dt, TOTAL);
    var seg = segOf(t);
    if (seg !== lastSeg) {
      lastSeg = seg;
      // restart logo video whenever we enter a segment that shows it
      if (seg === 's1' || seg === 's4') {
        try { video.currentTime = 0; video.play().catch(function () {}); } catch (e) {}
      } else {
        try { video.pause(); } catch (e) {}
      }
    }
    draw(t);
    if (t >= TOTAL) { setPlaying(false); return; }
    requestAnimationFrame(previewTick);
  }
  function setPlaying(p) {
    playing = p;
    $('btn-play').innerHTML = playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
    if (playing) {
      if (tCur >= TOTAL) { tCur = 0; lastSeg = null; }
      lastWall = performance.now();
      requestAnimationFrame(previewTick);
    } else {
      try { video.pause(); } catch (e) {}
    }
  }

  // --- export loop (deterministic stepping + CCapture) ------------------------
  // Every stage is logged and guarded: any throw/rejection lands in #log with
  // the exact stage + frame index, and the UI is always re-enabled (finally).
  function errText(e) {
    if (e == null) return 'unknown error';
    if (typeof e === 'string') return e;
    return e.message || String(e);
  }
  async function exportVideo() {
    if (exporting) return;
    var format = $('opt-format').value;
    var fps = parseInt($('opt-fps').value, 10) || 30;
    var quality = Math.max(1, Math.min(100, parseInt($('opt-quality').value, 10) || 90));
    var frames = Math.round(TOTAL * fps);
    exporting = true;
    setPlaying(false);
    $('btn-export').disabled = true;
    $('btn-play').disabled = true;
    setBar(0);
    try { video.pause(); } catch (e) { log('video pause: ' + errText(e), 'err'); }

    // Fallback when the CCapture CDN is unreachable: realtime MediaRecorder.
    if (typeof CCapture === 'undefined') {
      log('CCapture failed to load — falling back to realtime MediaRecorder (preview will play once).', 'err');
      try {
        await exportMediaRecorderFallback(frames, fps);
      } catch (e) {
        log('fallback export failed: ' + errText(e), 'err');
      } finally {
        exporting = false;
        $('btn-export').disabled = false;
        $('btn-play').disabled = false;
      }
      return;
    }

    var capturer = null;
    var activeFormat = format;
    try {
      log('capturing ' + frames + ' frames @' + fps + 'fps (' + activeFormat +
        ', q=' + quality + ') — page may look frozen, this is normal.');
      capturer = new CCapture({
        format: activeFormat, framerate: fps, quality: quality, name: 'motion-editor-export'
      });
      log('encoder starting (' + activeFormat + ')…');
      try {
        await capturer.start();
      } catch (e) {
        // mp4 needs WebCodecs; on browsers without it, retry as webm once.
        if (activeFormat === 'mp4') {
          log('mp4 encoder failed to start: ' + errText(e), 'err');
          log('retrying with webm…');
          activeFormat = 'webm';
          capturer = new CCapture({
            format: activeFormat, framerate: fps, quality: quality, name: 'motion-editor-export'
          });
          await capturer.start();
        } else {
          throw e;
        }
      }
      log('encoder ready — capturing frames…');
      var milestone = Math.max(fps * 5, 1); // log progress ~every 5s
      for (var i = 0; i < frames; i++) {
        var t = Math.min((i + 1) / fps, TOTAL);
        try {
          // No video seeks here: frames come from the pre-decoded store, and
          // touching video.currentTime mid-capture would register the element
          // with TimeWarp (which then fights scene-local seeks — black boxes).
          draw(t);
          await capturer.capture(canvas);
        } catch (e) {
          throw new Error('frame ' + (i + 1) + '/' + frames +
            ' (t=' + t.toFixed(2) + 's): ' + errText(e));
        }
        setBar((i + 1) / frames);
        if ((i + 1) % milestone === 0 || i === frames - 1) {
          $('time').textContent = fmtT(t) + '  (frame ' + (i + 1) + '/' + frames + ')';
          log('…frame ' + (i + 1) + '/' + frames +
            ' (' + Math.round(((i + 1) / frames) * 100) + '%)');
          // Timer-free yield (see NOTE above): lets the browser paint the
          // progress bar/log between frames without touching warped timers.
          await channelYield();
        }
      }
      setBar(1);
      log('finalizing ' + frames + ' frames (' + activeFormat + ')…');
      await capturer.stop();
      await capturer.save();
      log('done — file downloaded (' + activeFormat + ').', 'ok');
    } catch (e) {
      log('export failed: ' + errText(e), 'err');
      log('tip: try webm + 30fps; keep DevTools console (F12) output if it still fails.', 'err');
      // A failed session leaves TimeWarp's clock hooks installed (warped
      // rAF/timers freeze the preview). Stop the capturer to restore them.
      try { if (capturer) await capturer.stop(); } catch (_) {}
    } finally {
      exporting = false;
      $('btn-export').disabled = false;
      $('btn-play').disabled = false;
    }
  }

  // Realtime fallback: record the live preview through MediaRecorder.
  function exportMediaRecorderFallback(frames, fps) {
    return new Promise(function (resolve, reject) {
      var rec;
      try {
        var stream = canvas.captureStream(fps);
        var mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
          ? 'video/webm;codecs=vp9' : 'video/webm';
        rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
      } catch (e) {
        log('fallback recorder setup failed: ' + errText(e), 'err');
        reject(e);
        return;
      }
      var chunks = [];
      rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      rec.onerror = function (e) {
        log('fallback recorder error: ' + errText(e.error || e), 'err');
      };
      rec.onstop = function () {
        var blob = new Blob(chunks, { type: 'video/webm' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'motion-editor-export-fallback.webm';
        a.click();
        log('done (fallback webm) — file downloaded.', 'ok');
        resolve();
      };
      tCur = 0; lastSeg = null; setBar(0);
      rec.start();
      log('recording realtime preview…');
      setPlaying(true);
      var needMs = (TOTAL * 1000) + 400;
      var t0 = performance.now();
      (function watch() {
        setBar(Math.min((performance.now() - t0) / needMs, 1));
        if (!playing || (performance.now() - t0) >= needMs) {
          setPlaying(false);
          rec.stop();
        } else setTimeout(watch, 200);
      })();
    });
  }

  // --- boot ------------------------------------------------------------------
  // Decode the whole logo clip to 512px stills (73 frames, ~76MB) while the
  // clock is still real. Both video segments re-play 0→2.43s, so one store
  // covers every frame that needs video. Runs before any CCapture session.
  async function predecodeLogo() {
    var FPS = 30, S = 512;
    var dur = Math.min(isFinite(video.duration) ? video.duration : 2.43, 2.43);
    var N = Math.floor(dur * FPS) + 1;
    var frames = [];
    try { video.pause(); } catch (e) {}
    for (var k = 0; k < N; k++) {
      await seekVideo(Math.min(k / FPS, dur));
      var c = document.createElement('canvas');
      c.width = S; c.height = S;
      c.getContext('2d').drawImage(video, 0, 0, S, S);
      frames.push(c);
      if (k % 12 === 0 || k === N - 1) log('decoding logo video… ' + (k + 1) + '/' + N);
    }
    CanvasScenes.setFrameStore({ fps: FPS, list: frames });
    log('logo frames ready (' + N + ' stills).', 'ok');
  }
  async function boot() {
    $('scrub').max = TOTAL;
    $('time').textContent = fmtT(0);
    try {
      if (document.fonts && document.fonts.ready) {
        await Promise.race([
          Promise.all([
            document.fonts.load('800 96px Inter'),
            document.fonts.load('800 60px Inter'),
            document.fonts.load('600 21px Inter')
          ]),
          new Promise(function (r) { setTimeout(r, 2500); })
        ]);
        await document.fonts.ready;
      }
    } catch (e) { /* offline fonts: fall back to system stack */ }

    var bg;
    try {
      bg = BGLayers.prerender(W, H);
      log('backgrounds pre-rendered (' + W + 'x' + H + ').', 'ok');
    } catch (e) {
      log('BG prerender failed: ' + e.message, 'err');
      bg = { purple1: null, purple2: null };
    }

    try {
      await new Promise(function (resolve, reject) {
        if (video.readyState >= 2) { resolve(); return; }
        var to = setTimeout(function () { resolve(); }, 6000);
        video.addEventListener('loadeddata', function () {
          clearTimeout(to); resolve();
        }, { once: true });
        video.addEventListener('error', function () {
          clearTimeout(to); reject(new Error('assets/logo.mp4 failed to load'));
        }, { once: true });
        try { video.load(); } catch (e) { clearTimeout(to); resolve(); }
      });
      log('logo.mp4 ready (' + (video.videoWidth || '?') + 'x' +
        (video.videoHeight || '?') + ', ' + video.duration.toFixed(2) + 's).', 'ok');
    } catch (e) {
      log('video: ' + e.message + ' — boxes will render black.', 'err');
    }

    // Pre-decode logo.mp4 into still frames BEFORE any capture starts.
    // During capture the <video> element must not be touched: CCapture's
    // TimeWarp hooks currentTime/play and re-seeks registered media to the
    // warped timeline on every frame, which fights per-scene seeks (the boxes
    // rendered black). Decoding upfront is also faster and frame-accurate.
    try {
      await predecodeLogo();
    } catch (e) {
      log('logo pre-decode failed: ' + errText(e) + ' — live video fallback.', 'err');
    }

    try {
      await CanvasScenes.init({ bg: bg, video: video });
      log('scene assets ready.', 'ok');
    } catch (e) {
      log('scene init failed: ' + e.message, 'err');
      return;
    }

    if (typeof CCapture === 'undefined') {
      log('CCapture CDN unavailable — export will use MediaRecorder fallback.', 'err');
    } else {
      log('CCapture ready.', 'ok');
    }

    draw(0);
    log('preview ready. Press Play, scrub, then Export video.', 'ok');
    $('btn-play').disabled = false;
    $('btn-export').disabled = false;
  }

  $('btn-play').addEventListener('click', function () { setPlaying(!playing); });
  $('btn-export').addEventListener('click', exportVideo);
  $('scrub').addEventListener('input', function (e) {
    if (exporting) return;
    setPlaying(false);
    draw(parseFloat(e.target.value) || 0);
  });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !exporting &&
        document.activeElement.tagName !== 'INPUT' &&
        document.activeElement.tagName !== 'SELECT') {
      e.preventDefault();
      setPlaying(!playing);
    }
  });

  boot();
})();
</script>
</body>
</html>
